services:
  db:
    image: postgres:16-alpine
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kira}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Kira1803_Li}
      POSTGRES_DB: ${POSTGRES_DB:-kira}
    volumes:
      - kira_pgdata:/var/lib/postgresql/data
      - ${KPI_DATA_PATH}:/app/kpi_data:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kira}"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    restart: always
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy

volumes:
  kira_pgdata:
